name: Tao Te Ching sync

# sources/taoism-tao-te-ching.md is generated from opencosmos-ai/taoteching
# (opencosmos ADR 0020 §7) and must follow it with no hand step. This workflow
# regenerates it and, when it changed, commits it straight to main (Shalom's
# call, 2026-10-15) and runs Knowledge Sync, which re-embeds the corpus and
# redeploys the site.
#
# When it runs:
#   repository_dispatch `text-updated`, sent by taoteching's notify-opencosmos.yml
#     whenever its export changes on main. Needs KNOWLEDGE_DISPATCH_TOKEN there.
#   daily, as the fallback for a missed signal (an expired token, an outage).
#   by hand, with `ref` to generate from a taoteching branch and `dry_run` to
#     see the result without committing it.
#
# It always generates from taoteching's main unless `ref` says otherwise, never
# from the sha in the signal: signals can arrive out of order, and an older one
# must not overwrite a newer text.
#
# Why it runs Knowledge Sync itself: a push made with this workflow's own
# GITHUB_TOKEN does not trigger other workflows (GitHub's rule, to prevent
# loops), so the push alone would leave the corpus un-embedded. workflow_dispatch
# is the one trigger that token may fire.

on:
  repository_dispatch:
    types: [text-updated]
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: taoteching branch, tag or sha to generate from
        default: main
      dry_run:
        description: show the regenerated file's diff, commit nothing
        type: boolean
        default: false

permissions:
  contents: write   # commit the regenerated file to main
  actions: write    # run Knowledge Sync

concurrency:
  group: tao-te-ching-sync
  cancel-in-progress: false

jobs:
  regenerate:
    # The atlas listens for the same event type; only the Tao Te Ching is ours.
    if: github.event_name != 'repository_dispatch' || github.event.client_payload.text == 'tao-te-ching'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - name: Resolve the taoteching commit
        id: src
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref || 'main' }}
        run: |
          sha=$(gh api "repos/opencosmos-ai/taoteching/commits/$REF" --jq .sha)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "taoteching $REF is ${sha:0:7}"

      # Counts, not exit status: the generator refuses an export without 81
      # chapters, and prints how many sections it wrote.
      - name: Regenerate
        run: npm run -s ttc:generate -- --ref ${{ steps.src.outputs.sha }}

      - name: Stop if nothing changed
        id: diff
        run: |
          if git diff --quiet -- sources/taoism-tao-te-ching.md; then
            echo "::notice::sources/taoism-tao-te-ching.md is already current with taoteching@${{ steps.src.outputs.sha }}."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git diff --stat -- sources/taoism-tao-te-ching.md
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Show the change (dry run)
        if: steps.diff.outputs.changed == 'true' && inputs.dry_run
        run: git diff -- sources/taoism-tao-te-ching.md

      - name: Commit to main
        if: steps.diff.outputs.changed == 'true' && !inputs.dry_run
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources/taoism-tao-te-ching.md
          git commit -m "Tao Te Ching: regenerate from taoteching@${{ steps.src.outputs.sha }}" \
                     -m "Generated by .github/workflows/tao-te-ching.yml (${{ github.event_name }})."
          git push origin HEAD:main

      - name: Re-embed and redeploy
        if: steps.diff.outputs.changed == 'true' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run knowledge-sync.yml --ref main
