name: Knowledge Sync

# Fires on any corpus change. `.github/**` is excluded so editing this workflow
# does not itself trigger a full re-embed.
on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
  workflow_dispatch:

concurrency:
  # Cancel any in-progress run when a new push arrives.
  # Safe: the generators always read from the full repo checkout, not a Redis
  # delta, so restarting from the latest HEAD always includes all merged files.
  group: knowledge-sync
  cancel-in-progress: true

jobs:
  sync:
    name: Regenerate the graphs, re-embed the corpus, rebuild the site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Regenerate wiki graph
        env:
          UPSTASH_REDIS_REST_URL:   ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: npm run graph

      # The constellation is what /library/graph renders, and until now nothing
      # regenerated it automatically — the old workflow ran `graph` (which writes
      # knowledge:graph*) but never `graph:constellation` (which writes
      # knowledge:constellation). The visualisation only refreshed when someone
      # remembered to run it by hand.
      # Vector credentials are required as well as Redis: the generator's last
      # pass queries Upstash Vector for work-to-work similarity bridges. Without
      # them it warns, returns zero semantic edges and still exits 0 — so the
      # constellation loses its semantic underlayer with the step reporting green.
      - name: Regenerate constellation graph
        env:
          UPSTASH_REDIS_REST_URL:    ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN:  ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          UPSTASH_VECTOR_REST_URL:   ${{ secrets.UPSTASH_VECTOR_REST_URL }}
          UPSTASH_VECTOR_REST_TOKEN: ${{ secrets.UPSTASH_VECTOR_REST_TOKEN }}
        run: npm run graph:constellation

      # Incremental: chunks carry a content hash, so an unchanged corpus costs
      # zero writes. Only IDs under `knowledge/` are reconciled — Cosmo's kaizen
      # vectors are written by another repository and must survive this.
      - name: Embed corpus
        env:
          UPSTASH_VECTOR_REST_URL:   ${{ secrets.UPSTASH_VECTOR_REST_URL }}
          UPSTASH_VECTOR_REST_TOKEN: ${{ secrets.UPSTASH_VECTOR_REST_TOKEN }}
        run: npm run embed

      - name: Revalidate graph route (on-demand ISR)
        # Makes the regenerated graph visible within seconds, ahead of the
        # site rebuild below. The secret prevents unauthorized cache busting.
        run: |
          curl -X POST "${{ secrets.NEXT_PUBLIC_APP_URL }}/api/revalidate" \
            -H "Content-Type: application/json" \
            -H "x-revalidate-secret: ${{ secrets.REVALIDATE_SECRET }}" \
            -d '{"path": "/library/graph"}' \
            --fail-with-body

      # The Library's document pages are statically generated from this corpus
      # at build time, so a corpus change only reaches readers once the site is
      # rebuilt. Without this step the site would serve whatever the last
      # application deploy happened to clone.
      - name: Rebuild the site
        run: curl -X POST --fail-with-body "${{ secrets.VERCEL_DEPLOY_HOOK }}"
